<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portfolio & File Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="loadFiles()">
    <div class="container">
        <!-- Profile Section -->
        <header class="profile-header">
            <img src="my-photo.png" alt="Profile Photo" class="profile-img">
            <div class="profile-info">
                <h1>My IT Student Portfolio</h1>
                <p>Welcome to my file manager and project repository.</p>
            </div>
        </header>

        <!-- Navigation & Upload Bar -->
        <div class="toolbar">
            <div class="breadcrumb">
                <button onclick="goHome()" class="home-btn"><i class="fa fa-home"></i></button>
                <span id="current-path">root</span>
            </div>
            <div class="upload-actions">
                <label class="upload-btn">
                    <i class="fa fa-upload"></i> Upload File
                    <input type="file" id="file-input" onchange="handleFileUpload(event)" multiple hidden>
                </label>
                <label class="upload-btn folder-btn">
                    <i class="fa fa-folder-plus"></i> Upload Folder
                    <input type="file" id="folder-input" onchange="handleFolderUpload(event)" webkitdirectory directory multiple hidden>
                </label>
            </div>
        </div>

        <!-- File Grid Dropzone -->
        <div id="file-grid" class="file-grid" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            <!-- Dynamic items rendered here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
